<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #09090c;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px 16px 40px;
    }

    /* Вспышка на весь экран */
    .flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.7s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .flash.active {
      opacity: 1;
      transition: opacity 0.03s ease-in;
    }

    /* 1. ЭКРАН С БРЕЛОКОМ */
    .keychain-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 320px;
      transition: opacity 0.8s ease, transform 0.8s ease;
      cursor: pointer;
    }

    .keychain-screen.hidden {
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
    }

    .chain-rig {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: -6px;
      z-index: 2;
    }

    .keyring {
      width: 38px;
      height: 38px;
      border: 4px solid #b0b3b8;
      border-radius: 50%;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.6), 0 3px 8px rgba(0,0,0,0.5);
    }

    .chain-links {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -2px;
    }

    .chain-link {
      width: 7px;
      height: 12px;
      border: 2px solid #8e9297;
      border-radius: 5px;
      margin-top: -4px;
      background: #4a4d52;
    }

    .heart-wrapper {
      position: relative;
      width: 250px;
      height: 225px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 800px;
    }

    .secret-message {
      position: absolute;
      width: 230px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      color: #f7f7f7;
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.6s ease, transform 0.6s ease;
      z-index: 1;
      padding: 10px;
      pointer-events: none;
    }

    .secret-message strong {
      color: #ff9ebb;
      display: block;
      margin-top: 6px;
      font-size: 16px;
    }

    .secret-message.visible {
      opacity: 1;
      transform: scale(1);
    }

    .heart-half {
      position: absolute;
      top: 0;
      width: 125px;
      height: 225px;
      overflow: hidden;
      transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 5;
    }

    .heart-left { left: 0; transform-origin: left center; }
    .heart-right { right: 0; transform-origin: right center; }

    .heart-wrapper.opened .heart-left { transform: translateX(-70px) rotateY(-65deg); }
    .heart-wrapper.opened .heart-right { transform: translateX(70px) rotateY(65deg); }

    .heart-shape {
      position: absolute;
      width: 250px;
      height: 225px;
      top: 0;
    }

    .heart-left .heart-shape { left: 0; }
    .heart-right .heart-shape { left: -125px; }

    .tap-hint {
      margin-top: 24px;
      font-size: 14px;
      color: #888892;
      letter-spacing: 0.5px;
      animation: pulseText 1.6s ease-in-out infinite;
      transition: opacity 0.4s ease;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    /* 2. ЭКРАН ТАЙМЕРА */
    .countdown-screen {
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .countdown-screen.fade-in {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .countdown-screen.fade-out {
      opacity: 0;
      transform: scale(0.92);
      pointer-events: none;
    }

    .countdown-msg {
      font-size: 24px;
      font-weight: 500;
      color: #e0e0e5;
      letter-spacing: -0.3px;
      line-height: 1.4;
    }

    .timer-digit {
      display: inline-block;
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      margin-left: 6px;
      min-width: 24px;
      animation: digitPop 1s ease-in-out infinite;
    }

    @keyframes digitPop {
      0% { transform: scale(1); opacity: 0.85; }
      40% { transform: scale(1.22); opacity: 1; color: #ff5252; }
      100% { transform: scale(1); opacity: 0.85; }
    }

    /* 3. ГЛАВНАЯ СЦЕНА POLAROID */
    .stage {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 340px;
      position: relative;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
      perspective: 1100px;
    }

    .stage.show {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .polaroid-cam {
      width: 310px;
      height: 250px;
      background: #18181a;
      border-radius: 46px 46px 28px 28px;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 1px 2px rgba(255, 255, 255, 0.15);
      z-index: 20;
      border: 1px solid #28282b;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 1.2s ease, opacity 1.2s ease;
    }

    /* Когда фото ложится на стол, камера слегка отъезжает назад */
    .stage.table-mode .polaroid-cam {
      transform: translateY(-20px) scale(0.92);
      opacity: 0.85;
    }

    .cam-shutter {
      position: absolute;
      top: -6px;
      left: 60px;
      width: 44px;
      height: 12px;
      background: #e63025;
      border-radius: 6px 6px 0 0;
      box-shadow: 0 -2px 8px rgba(230, 48, 37, 0.4);
    }

    .cam-bump {
      position: absolute;
      top: -8px;
      right: 50px;
      width: 60px;
      height: 16px;
      background: #18181a;
      border-radius: 12px 12px 0 0;
      border-top: 1px solid #28282b;
    }

    .spectrum-stripe {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 16px;
      display: flex;
      border-radius: 3px;
      overflow: hidden;
      z-index: 5;
    }
    .stripe-red    { flex: 1; background: #ea3323; }
    .stripe-orange { flex: 1; background: #f37021; }
    .stripe-yellow { flex: 1; background: #ffc20e; }
    .stripe-green  { flex: 1; background: #00a651; }
    .stripe-blue   { flex: 1; background: #0085ca; }

    .cam-flash {
      position: absolute;
      top: 36px;
      left: 18px;
      width: 78px;
      height: 56px;
      background: #0f0f11;
      border-radius: 12px;
      border: 2px solid #2c2c30;
      overflow: hidden;
    }
    .flash-grid {
      width: 100%;
      height: 38px;
      background: repeating-linear-gradient(90deg, rgba(255,255,255,0.7) 0px, rgba(255,255,255,0.7) 2px, rgba(20,20,25,0.6) 2px, rgba(20,20,25,0.6) 4px);
      border-bottom: 2px solid #333;
    }
    .flash-sensor-row {
      height: 14px;
      background: #151518;
      display: flex;
      align-items: center;
      gap: 4px;
      padding-left: 6px;
    }
    .sensor-dot { width: 4px; height: 4px; background: #2b2b2e; border-radius: 50%; }

    .cam-lens {
      position: absolute;
      top: 34px;
      left: 50%;
      transform: translateX(-50%);
      width: 106px;
      height: 106px;
      border-radius: 50%;
      background: repeating-radial-gradient(circle, #111113 0, #111113 3px, #222226 3px, #222226 5px);
      border: 5px solid #252529;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lens-core {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #304254 0%, #080c10 75%);
      border: 3px solid #141416;
      position: relative;
    }
    .lens-glint {
      position: absolute;
      top: 7px;
      left: 9px;
      width: 11px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      transform: rotate(-35deg);
    }

    .cam-viewfinder {
      position: absolute;
      top: 36px;
      right: 18px;
      width: 78px;
      height: 58px;
      background: #0f0f11;
      border-radius: 12px;
      border: 2px solid #2c2c30;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vf-optic {
      width: 48px;
      height: 38px;
      background: radial-gradient(circle at 50% 40%, #1e2832 0%, #0a0e12 80%);
      border-radius: 8px;
      border: 1px solid #333;
      position: relative;
    }
    .vf-glint {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 8px;
      height: 8px;
      background: rgba(255,255,255,0.7);
      border-radius: 2px;
    }

    .cam-brand {
      position: absolute;
      right: 28px;
      bottom: 58px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #888890;
      text-transform: lowercase;
    }

    .cam-slot {
      position: absolute;
      bottom: 22px;
      width: 250px;
      height: 14px;
      background: #09090b;
      border-radius: 7px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.9);
      border: 1px solid #222225;
    }

    /* Лоток выезда фото с 3D-трансформацией */
    .photo-tray {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: -34px;
      z-index: 10;
      position: relative;
      perspective: 1000px;
    }

    .polaroid-card {
      width: 240px;
      background: #fdfbf7;
      padding: 13px 13px 24px 13px;
      border-radius: 3px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-260px);
      opacity: 0;
      transition: transform 3.6s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.3s ease;
      position: relative;
      transform-style: preserve-3d;
    }

    .polaroid-card.ejected {
      transform: translateY(32px) rotateX(0deg);
      opacity: 1;
    }

    /* Анимация: фото ложится плоско на стол */
    .polaroid-card.laid-flat {
      transition: transform 1.6s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 1.6s ease;
      transform: translateY(55px) rotateX(58deg) scale(0.95);
      box-shadow: 0 35px 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 105, 180, 0.15);
    }

    .photo-area {
      width: 100%;
      height: 212px;
      background: #141414;
      border-radius: 1px;
      overflow: visible;
      position: relative;
      transform-style: preserve-3d;
    }

    .photo-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) brightness(0.18) contrast(0.4);
      transition: filter 4.5s ease-out, opacity 1.2s ease;
      border-radius: 1px;
    }

    .photo-area img.developed {
      filter: grayscale(0%) brightness(1) contrast(1);
    }

    .photo-area img.dimmed {
      opacity: 0.3;
      filter: brightness(0.45) contrast(0.85);
    }

    .photo-words {
      margin-top: 14px;
      color: #242426;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
      font-weight: 500;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 1.6s ease, transform 1.6s ease, color 1s ease;
    }

    .photo-words.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 4. ПЕРПЕНДИКУЛЯРНАЯ РОЗОВАЯ ГОЛОГРАММА */
    .hologram-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      z-index: 50;
      transform-style: preserve-3d;
      transition: opacity 0.8s ease;
    }

    .hologram-stage.active {
      opacity: 1;
    }

    /* Световой луч на поверхности фотокарточки */
    .holo-light-beam {
      position: absolute;
      bottom: -15px;
      width: 190px;
      height: 190px;
      background: radial-gradient(ellipse at center, rgba(255, 80, 160, 0.5) 0%, rgba(255, 80, 160, 0.15) 50%, transparent 75%);
      filter: blur(12px);
      animation: beamPulse 2.8s ease-in-out infinite alternate;
    }

    @keyframes beamPulse {
      0% { opacity: 0.65; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1.08); }
    }

    /* Фигура Hello Kitty: встает перпендикулярно из фото (rotateX(-58deg)) */
    .holo-kitty-figure {
      position: absolute;
      bottom: 20px;
      width: 175px;
      height: 195px;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Стартует лежащей внутри плоскости и утопленной */
      transform: rotateX(0deg) translateZ(0px) scale(0.6);
      opacity: 0;
      transform-origin: bottom center;
      transition: transform 2.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.2s ease;
      filter: drop-shadow(0 0 10px #ff2a7a) drop-shadow(0 0 24px rgba(255, 42, 122, 0.65));
      transform-style: preserve-3d;
    }

    /* Когда встает: разворачивается ровно к зрителю вертикально и парит вверх */
    .hologram-stage.risen .holo-kitty-figure {
      transform: rotateX(-58deg) translateZ(90px) translateY(-30px) scale(1.08);
      opacity: 1;
      animation: holoLevitate 3.6s ease-in-out infinite alternate 2.4s;
    }

    @keyframes holoLevitate {
      0% {
        transform: rotateX(-58deg) translateZ(85px) translateY(-30px) scale(1.08) rotateZ(-1deg);
      }
      50% {
        transform: rotateX(-58deg) translateZ(105px) translateY(-42px) scale(1.12) rotateZ(1deg);
      }
      100% {
        transform: rotateX(-58deg) translateZ(88px) translateY(-32px) scale(1.08) rotateZ(-0.5deg);
      }
    }

    /* Сканирующие неоновые полосы */
    .holo-scanlines {
      position: absolute;
      inset: -5px;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 200, 225, 0.25) 0px,
        rgba(255, 200, 225, 0.25) 2px,
        transparent 2px,
        transparent 6px
      );
      mix-blend-mode: overlay;
      pointer-events: none;
      animation: scanMove 4s linear infinite;
    }

    @keyframes scanMove {
      from { background-position: 0 0; }
      to { background-position: 0 80px; }
    }

    /* Неоновое пульсирующее сердечко в лапках */
    .holo-heart {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      transition: transform 1.1s cubic-bezier(0.175, 0.885, 0.32, 1.4), opacity 0.8s ease;
      filter: drop-shadow(0 0 10px #ff0055) drop-shadow(0 0 20px #ff6699);
      z-index: 10;
    }

    .holo-heart.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      animation: heartBeat 1.4s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      14% { transform: translate(-50%, -50%) scale(1.26); }
      28% { transform: translate(-50%, -50%) scale(1.06); }
      42% { transform: translate(-50%, -50%) scale(1.28); }
    }

    /* Звездочки-искорки */
    .sparkle {
      position: absolute;
      color: #ff99cc;
      font-size: 15px;
      opacity: 0;
      animation: sparkleFloat 2.2s infinite ease-in-out;
    }
    .sp1 { top: -10px; left: 10px; animation-delay: 0.2s; }
    .sp2 { top: -15px; right: 15px; animation-delay: 0.8s; }
    .sp3 { top: 60px; right: -5px; animation-delay: 1.4s; }
    .sp4 { top: 65px; left: -5px; animation-delay: 1.9s; }

    @keyframes sparkleFloat {
      0%, 100% { opacity: 0; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.25); }
    }
  </style>
</head>
<body>

  <!-- Белая вспышка -->
  <div class="flash" id="flash"></div>

  <!-- 1. Экран с интерактивным брелоком -->
  <div class="keychain-screen" id="keychainScreen">
    <div class="chain-rig">
      <div class="keyring"></div>
      <div class="chain-links">
        <div class="chain-link"></div>
        <div class="chain-link"></div>
        <div class="chain-link"></div>
      </div>
    </div>

    <div class="heart-wrapper" id="heartWrapper">
      <div class="secret-message" id="secretMsg">
        5 месяцев разлуки закончились прямо сейчас.<br>
        Этот брелок — напоминание, что мы снова рядом.<br>
        <strong>Наконец-то мы вместе.</strong>
      </div>

      <div class="heart-half heart-left">
        <svg class="heart-shape" viewBox="0 0 200 180">
          <path d="M100,170 C100,170 10,115 10,55 C10,22 35,5 65,5 C82,5 94,15 100,25 C106,15 118,5 135,5 C165,5 190,22 190,55 C190,115 100,170 100,170 Z" 
                fill="#f89cb4" stroke="#e07a95" stroke-width="3" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.4))"/>
          <path d="M82,75 A26,26 0 0,1 100,68" fill="none" stroke="#222" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M86,88 A16,16 0 0,1 100,82" fill="none" stroke="#222" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M91,101 A7,7 0 0,1 100,97" fill="none" stroke="#222" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="heart-half heart-right">
        <svg class="heart-shape" viewBox="0 0 200 180">
          <path d="M100,170 C100,170 10,115 10,55 C10,22 35,5 65,5 C82,5 94,15 100,25 C106,15 118,5 135,5 C165,5 190,22 190,55 C190,115 100,170 100,170 Z" 
                fill="#f89cb4" stroke="#e07a95" stroke-width="3" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.4))"/>
          <path d="M100,68 A26,26 0 0,1 118,75" fill="none" stroke="#222" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M100,82 A16,16 0 0,1 114,88" fill="none" stroke="#222" stroke-width="4.5" stroke-linecap="round"/>
          <path d="M100,97 A7,7 0 0,1 109,101" fill="none" stroke="#222" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="tap-hint" id="tapHint">Коснись сердечка ✨</div>
  </div>

  <!-- 2. Экран таймера -->
  <div class="countdown-screen" id="countdownScreen">
    <div class="countdown-msg">
      Сейчас что-то произойдет через <span class="timer-digit" id="timerDigit">5</span>
    </div>
  </div>

  <!-- 3. Polaroid и печать Hello Kitty -->
  <div class="stage" id="stage">
    <div class="polaroid-cam">
      <div class="cam-shutter"></div>
      <div class="cam-bump"></div>

      <div class="spectrum-stripe">
        <div class="stripe-red"></div>
        <div class="stripe-orange"></div>
        <div class="stripe-yellow"></div>
        <div class="stripe-green"></div>
        <div class="stripe-blue"></div>
      </div>

      <div class="cam-flash">
        <div class="flash-grid"></div>
        <div class="flash-sensor-row">
          <div class="sensor-dot"></div>
          <div class="sensor-dot"></div>
          <div class="sensor-dot"></div>
        </div>
      </div>

      <div class="cam-lens">
        <div class="lens-core">
          <div class="lens-glint"></div>
        </div>
      </div>

      <div class="cam-viewfinder">
        <div class="vf-optic">
          <div class="vf-glint"></div>
        </div>
      </div>

      <div class="cam-brand">polaroid</div>
      <div class="cam-slot"></div>
    </div>

    <div class="photo-tray">
      <div class="polaroid-card" id="card">
        <div class="photo-area">
          <img src="hello_kitty.JPG" alt="Hello Kitty" id="photoImg">

          <!-- 4. Голограмма Hello Kitty -->
          <div class="hologram-stage" id="holoStage">
            <div class="holo-light-beam"></div>

            <div class="holo-kitty-figure" id="holoFigure">
              <div class="holo-scanlines"></div>

              <!-- Искорки вокруг -->
              <span class="sparkle sp1">✦</span>
              <span class="sparkle sp2">✨</span>
              <span class="sparkle sp3">✦</span>
              <span class="sparkle sp4">💖</span>

              <!-- Каноничный неоновый вектор Hello Kitty -->
              <svg viewBox="0 0 160 175" width="100%" height="100%">
                <!-- Платье-трапеция -->
                <path d="M48,102 L30,148 Q80,158 130,148 L112,102 Z" 
                      fill="rgba(255, 51, 133, 0.45)" stroke="#ff3385" stroke-width="4" stroke-linejoin="round"/>
                
                <!-- Овальные ножки -->
                <ellipse cx="56" cy="154" rx="16" ry="9" fill="rgba(255, 230, 242, 0.8)" stroke="#ff3385" stroke-width="3.5"/>
                <ellipse cx="104" cy="154" rx="16" ry="9" fill="rgba(255, 230, 242, 0.8)" stroke="#ff3385" stroke-width="3.5"/>
                
                <!-- Голова Hello Kitty -->
                <path d="M42,38 C26,12 20,24 24,48 C16,74 28,94 80,94 C132,94 144,74 136,48 C140,24 134,12 118,38 C104,32 94,30 80,30 C66,30 56,32 42,38 Z" 
                      fill="rgba(255, 240, 248, 0.9)" stroke="#ff3385" stroke-width="4.5" stroke-linejoin="round"/>
                
                <!-- Левый открытый глазик -->
                <ellipse cx="48" cy="62" rx="5" ry="7.5" fill="#ff0066"/>
                
                <!-- Правый подмигивающий глазик дугой -->
                <path d="M102,63 Q111,54 120,63" fill="none" stroke="#ff0066" stroke-width="4.5" stroke-linecap="round"/>
                
                <!-- Желтый овальный носик -->
                <ellipse cx="80" cy="70" rx="5.5" ry="4" fill="#ffe033" stroke="#ff8800" stroke-width="1.8"/>
                
                <!-- Усики слева -->
                <line x1="12" y1="58" x2="30" y2="61" stroke="#ff3385" stroke-width="3.5" stroke-linecap="round"/>
                <line x1="10" y1="70" x2="29" y2="70" stroke="#ff3385" stroke-width="3.5" stroke-linecap="round"/>
                <line x1="14" y1="82" x2="31" y2="78" stroke="#ff3385" stroke-width="3.5" stroke-linecap="round"/>
                
                <!-- Усики справа -->
                <line x1="130" y1="61" x2="148" y2="58" stroke="#ff3385" stroke-width="3.5" stroke-linecap="round"/>
                <line x1="131" y1="70" x2="150" y2="70" stroke="#ff3385" stroke-width="3.5" stroke-linecap="round"/>
                <line x1="129" y1="78" x2="146" y2="82" stroke="#ff3385" stroke-width="3.5" stroke-linecap="round"/>
                
                <!-- Каноничный объемный бантик на левом ушке -->
                <circle cx="120" cy="28" r="9" fill="#ff0066" stroke="#ffffff" stroke-width="2.5"/>
                <ellipse cx="106" cy="22" rx="12" ry="9.5" transform="rotate(-18 106 22)" fill="#ff3385" stroke="#ffffff" stroke-width="2"/>
                <ellipse cx="134" cy="34" rx="12" ry="9.5" transform="rotate(-18 134 34)" fill="#ff3385" stroke="#ffffff" stroke-width="2"/>
                
                <!-- Лапки, сложенные перед собой -->
                <ellipse cx="60" cy="108" rx="13" ry="10" transform="rotate(32 60 108)" fill="rgba(255, 240, 248, 0.95)" stroke="#ff3385" stroke-width="3.5"/>
                <ellipse cx="100" cy="108" rx="13" ry="10" transform="rotate(-32 100 108)" fill="rgba(255, 240, 248, 0.95)" stroke="#ff3385" stroke-width="3.5"/>
              </svg>

              <!-- Неоновое пульсирующее сердечко -->
              <div class="holo-heart" id="holoHeart">
                <svg width="48" height="44" viewBox="0 0 24 22">
                  <path d="M12,21.35L10.55,20.03C5.4,15.36 2,12.28 2,8.5C2,5.42 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.09C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.42 22,8.5C22,12.28 18.6,15.36 13.45,20.04L12,21.35Z" 
                        fill="#ff0066" stroke="#ffffff" stroke-width="2"/>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <div class="photo-words" id="photoWords">
          Наш первый общий снимок начинается здесь ✨
        </div>
      </div>
    </div>
  </div>

  <script>
    const keychainScreen = document.getElementById('keychainScreen');
    const heartWrapper = document.getElementById('heartWrapper');
    const secretMsg = document.getElementById('secretMsg');
    const tapHint = document.getElementById('tapHint');

    const countdownScreen = document.getElementById('countdownScreen');
    const timerDigit = document.getElementById('timerDigit');
    const stage = document.getElementById('stage');
    const flash = document.getElementById('flash');
    const card = document.getElementById('card');
    const photoImg = document.getElementById('photoImg');
    const photoWords = document.getElementById('photoWords');

    const holoStage = document.getElementById('holoStage');
    const holoHeart = document.getElementById('holoHeart');

    let isOpened = false;

    function playCameraSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(25, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.8, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);

        setTimeout(() => {
          const motor = ctx.createOscillator();
          const motorGain = ctx.createGain();
          motor.type = 'sawtooth';
          motor.frequency.setValueAtTime(78, ctx.currentTime);
          motor.frequency.linearRampToValueAtTime(92, ctx.currentTime + 1.4);
          motorGain.gain.setValueAtTime(0.06, ctx.currentTime);
          motorGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.4);
          motor.connect(motorGain);
          motorGain.connect(ctx.destination);
          motor.start();
          motor.stop(ctx.currentTime + 1.4);
        }, 120);
      } catch (e) {
        console.warn(e);
      }
    }

    function playHoloSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') ctx.resume();

        const freqs = [523.25, 659.25, 783.99, 1046.50];
        freqs.forEach((f, i) => {
          setTimeout(() => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime);
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 1.2);
          }, i * 160);
        });
      } catch (e) {}
    }

    keychainScreen.addEventListener('click', () => {
      if (isOpened) return;
      isOpened = true;

      tapHint.style.opacity = '0';
      heartWrapper.classList.add('opened');
      
      setTimeout(() => {
        secretMsg.classList.add('visible');
      }, 300);

      setTimeout(() => {
        secretMsg.classList.remove('visible');
        heartWrapper.classList.remove('opened');

        setTimeout(() => {
          keychainScreen.classList.add('hidden');

          setTimeout(() => {
            keychainScreen.style.display = 'none';
            startCountdown();
          }, 800);

        }, 600);

      }, 5000);
    });

    function startCountdown() {
      countdownScreen.classList.add('fade-in');

      let count = 5;
      const timerInterval = setInterval(() => {
        count--;
        if (count > 0) {
          timerDigit.textContent = count;
        } else {
          clearInterval(timerInterval);
          triggerCamera();
        }
      }, 1000);
    }

    function triggerCamera() {
      countdownScreen.classList.remove('fade-in');
      countdownScreen.classList.add('fade-out');

      setTimeout(() => {
        countdownScreen.style.display = 'none';
        stage.classList.add('show');

        setTimeout(() => {
          playCameraSound();
          flash.classList.add('active');

          setTimeout(() => {
            flash.classList.remove('active');
          }, 90);

          // 1. Выезд карточки Polaroid
          setTimeout(() => {
            card.classList.add('ejected');
          }, 250);

          // 2. Проявление фото Hello Kitty
          setTimeout(() => {
            photoImg.classList.add('developed');
          }, 1600);

          // 3. Появление текста
          setTimeout(() => {
            photoWords.classList.add('show');
          }, 3600);

          // 4. Карточка висит перед глазами 3.5 секунды, затем ПЛАВНО ЛОЖИТСЯ НА СТОЛ
          setTimeout(() => {
            stage.classList.add('table-mode');
            card.classList.add('laid-flat');

            // 5. Когда карточка легла — включается голограмма и вырастает вверх
            setTimeout(() => {
              playHoloSound();
              photoImg.classList.add('dimmed');
              holoStage.classList.add('active');

              // Плавный подъем вертикально перпендикулярно столу
              setTimeout(() => {
                holoStage.classList.add('risen');
              }, 400);

              // Hello Kitty зажигает сердечко в лапках
              setTimeout(() => {
                holoHeart.classList.add('active');
                photoWords.innerHTML = '«Наконец-то вы вместе! Я так этого ждала 💕»';
                photoWords.style.color = '#ff3385';
              }, 2200);

            }, 1400);

          }, 6500);

        }, 650);

      }, 500);
    }
  </script>
</body>
