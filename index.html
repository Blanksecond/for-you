<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For You</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #141414;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 24px;
    }

    /* Эффект яркой белой вспышки */
    .flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.7s ease-out;
    }

    .flash.active {
      opacity: 1;
      transition: opacity 0.04s ease-in;
    }

    /* Экран приглашения к нажатию */
    .intro-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: opacity 0.4s ease, transform 0.4s ease;
      text-align: center;
    }

    .intro-screen.hidden {
      opacity: 0;
      transform: scale(0.95);
      pointer-events: none;
      display: none;
    }

    .action-btn {
      background: #fdfbf7;
      color: #1a1a1a;
      border: none;
      padding: 16px 36px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(255, 255, 255, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    /* Сцена фотоаппарата и выезжающего фото */
    .stage {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 320px;
      position: relative;
    }

    .stage.visible {
      display: flex;
    }

    /* Корпус камеры */
    .camera {
      width: 250px;
      height: 170px;
      background: #242426;
      border-radius: 36px;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
      border: 1px solid #333336;
    }

    /* Красная кнопка спуска */
    .shutter-button {
      position: absolute;
      top: -8px;
      left: 36px;
      width: 34px;
      height: 10px;
      background: #e63946;
      border-radius: 4px 4px 0 0;
      box-shadow: 0 -2px 6px rgba(230, 57, 70, 0.4);
    }

    /* Вспышка на корпусе */
    .flash-window {
      position: absolute;
      top: 20px;
      right: 24px;
      width: 28px;
      height: 28px;
      background: radial-gradient(circle, #fff 15%, #ccc 60%, #999 100%);
      border-radius: 8px;
      border: 2px solid #444;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.5);
    }

    /* Видоискатель */
    .viewfinder {
      position: absolute;
      top: 24px;
      left: 28px;
      width: 16px;
      height: 16px;
      background: #111;
      border-radius: 4px;
      border: 2px solid #444;
    }

    /* Объектив камеры */
    .lens-outer {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, #1a1a1a 45%, #2a2a2a 70%, #444 100%);
      border: 6px solid #38383a;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .lens-glass {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2b3a4a 0%, #0a0e14 70%);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .lens-glare {
      position: absolute;
      top: 10px;
      left: 12px;
      width: 12px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: rotate(-35deg);
    }

    /* Слот выхода фотографии */
    .slot {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: -24px;
      z-index: 10;
    }

    /* Карточка моментального фото */
    .polaroid {
      width: 230px;
      background: #fdfbf7;
      padding: 14px 14px 22px 14px;
      border-radius: 4px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-240px);
      opacity: 0;
      transition: transform 3.8s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.4s ease;
    }

    .polaroid.ejected {
      transform: translateY(24px);
      opacity: 1;
    }

    /* Окошко с фото */
    .photo-wrapper {
      width: 100%;
      height: 205px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Эффект химического проявления */
      filter: grayscale(100%) brightness(0.18) contrast(0.4);
      transition: filter 4.5s ease-out;
    }

    .photo-wrapper img.developed {
      filter: grayscale(0%) brightness(1) contrast(1);
    }

    /* Подпись под фото */
    .photo-caption {
      margin-top: 14px;
      color: #262626;
      font-size: 14px;
      line-height: 1.45;
      text-align: center;
      font-weight: 500;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 1.8s ease, transform 1.8s ease;
    }

    .photo-caption.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Белая вспышка -->
  <div class="flash" id="flash"></div>

  <!-- Кнопка первого экрана -->
  <div class="intro-screen" id="introScreen">
    <button class="action-btn" id="triggerBtn">Сделать снимок ✨</button>
  </div>

  <!-- Сцена камеры и фото -->
  <div class="stage" id="stage">
    <div class="camera">
      <div class="shutter-button"></div>
      <div class="viewfinder"></div>
      <div class="lens-outer">
        <div class="lens-glass">
          <div class="lens-glare"></div>
        </div>
      </div>
      <div class="flash-window"></div>
    </div>

    <div class="slot">
      <div class="polaroid" id="polaroid">
        <div class="photo-wrapper">
          <!-- Замени ссылку на свою картинку или локальный файл, например my-photo.jpg -->
          <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=700&q=80" alt="Moment" id="photo">
        </div>
        <div class="photo-caption" id="caption">
          «Полгода ожидания подошли к концу.<br>Наш первый совместный кадр начинается здесь.»
        </div>
      </div>
    </div>
  </div>

  <script>
    const triggerBtn = document.getElementById('triggerBtn');
    const introScreen = document.getElementById('introScreen');
    const stage = document.getElementById('stage');
    const flash = document.getElementById('flash');
    const polaroid = document.getElementById('polaroid');
    const photo = document.getElementById('photo');
    const caption = document.getElementById('caption');

    // Генерация звука затвора и мотора печати (без внешних файлов)
    function playShutterSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Щелчок затвора
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.85, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);

        // Моторчик подачи бумаги Instax
        setTimeout(() => {
          const motor = ctx.createOscillator();
          const motorGain = ctx.createGain();
          motor.type = 'sawtooth';
          motor.frequency.setValueAtTime(75, ctx.currentTime);
          motor.frequency.linearRampToValueAtTime(90, ctx.currentTime + 1.4);
          motorGain.gain.setValueAtTime(0.06, ctx.currentTime);
          motorGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.4);
          motor.connect(motorGain);
          motorGain.connect(ctx.destination);
          motor.start();
          motor.stop(ctx.currentTime + 1.4);
        }, 120);
      } catch (e) {
        console.warn("Audio Context init prevented", e);
      }
    }

    triggerBtn.addEventListener('click', () => {
      // Скрываем стартовую кнопку
      introScreen.classList.add('hidden');
      stage.classList.add('visible');

      // 1. Щелчок и белая вспышка
      playShutterSound();
      flash.classList.add('active');

      setTimeout(() => {
        flash.classList.remove('active');
      }, 90);

      // 2. Медленный выезд карточки из-под корпуса
      setTimeout(() => {
        polaroid.classList.add('ejected');
      }, 250);

      // 3. Химическое проявление цветов фотографии
      setTimeout(() => {
        photo.classList.add('developed');
      }, 1600);

      // 4. Плавное появление надписи под фотографией
      setTimeout(() => {
        caption.classList.add('visible');
      }, 3500);
    });
  </script>
</body>
</html>
